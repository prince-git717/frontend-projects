<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Focus on Today</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>

<body>

  <section class="section1">

    <h1>Focus on <span>Today</span></h1>

    <main>

      <div class="top-row">
        <div class="bs-ye">
          <span class="tera-nam">Today</span>
          <img src="./sun.png" alt="sun" />
        </div>
        <div class="date-chip"></div>
      </div>

      <p class="paragraph">Raise the bar by completing your goals</p>

      <div class="progress-wrap">
        <div class="capsule">
          <div class="capsule2" id="bar"></div>
        </div>
        <span class="progress-label" id="prog-label">0 / 3</span>
      </div>

      <div class="tasks">

        <div class="gola-likh">
          <div class="gola">
            <img src="./Vector 1.png" alt="done" />
          </div>
          <input class="task-input" id="first-input" type="text" placeholder="Add a task…" />
        </div>

        <div class="gola-likh">
          <div class="gola">
            <img src="./Vector 1.png" alt="done" />
          </div>
          <input class="task-input" id="second-input" type="text" placeholder="Add a task…" />
        </div>

        <div class="gola-likh">
          <div class="gola">
            <img src="./Vector 1.png" alt="done" />
          </div>
          <input class="task-input" id="third-input" type="text" placeholder="Add a task…" />
        </div>

      </div>

      <p class="paragraph2">"Keep going — you're making great progress."</p>
      <p class="paragraph3">Made with ❤️ · 7/17</p>

    </main>
  </section>

  <script src="script.js"></script>

</body>
</html>
